<aside class="ac-sidebar">
  <nav class="ac-nav">
    <a href="{% url 'accounts:dashboard' %}"
      class="ac-nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Overview
    </a>
    <a href="{% url 'accounts:order_history' %}"
      class="ac-nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Orders
    </a>
    <a href="{% url 'orders:cart_detail' %}"
      class="ac-nav-link {% if request.resolver_match.url_name == 'cart_detail' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      My Bag
      {% if cart_count > 0 %}
      <span class="ac-nav-badge">{{ cart_count }}</span>
      {% endif %}
    </a>
    <a href="{% url 'accounts:addresses' %}"
      class="ac-nav-link {% if 'address' in request.resolver_match.url_name %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Addresses
    </a>
    <a href="{% url 'accounts:profile' %}"
      class="ac-nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>

    <div class="ac-nav-divider"></div>

    <form method="POST" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="ac-nav-link ac-nav-logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </form>
  </nav>
</aside>
